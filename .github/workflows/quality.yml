name: Calidad

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tglab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tglab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tglab?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tglab?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      STORAGE_DRIVER: local
      PAYMENTS_BANK_TRANSFER_ENABLED: "true"
      RESEND_API_KEY: ""

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate

      - name: Aplicar migraciones
        run: npm run db:migrate:deploy

      - name: Cargar datos de prueba
        run: npm run db:seed

      - name: Lint, tipos, unitarias y build
        run: npm run check

      - name: Pruebas de integración
        run: npm run test:integration

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas end-to-end
        run: npm run test:e2e

      - name: Guardar evidencia de fallos E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
